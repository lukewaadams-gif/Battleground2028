Briefing.TEXT = [
[
"Battleground 2028 puts you in charge of a presidential campaign. In a full campaign you begin the week after the November 2026 midterms as one of the party's possible candidates. You must survive the invisible primary (money, staff, endorsements, debates), win delegates in the primaries and caucuses, pick a running mate, survive the conventions and then beat the other party's nominee in the general election on November 7, 2028. Before you start you can shape the field: keep candidates out of either primary, or lock in the other party's nominee. Or run as an independent (see 'Running as an independent').",
"#The screen",
"The top bar shows your cash, your standing (primary polls and delegates, or the national polls and electoral votes), your national name recognition (hover for your best and worst states), your base's enthusiasm and your candidate's stamina. END WEEK resolves the turn; in the final two weeks it becomes END DAY.",
"The left panel holds seven tabs: Schedule, Money, Field, Message, Polls, Campaign and News. The map sits in the middle with five views (six during the primaries). The right panel shows the selected state - or the nation when nothing is selected.",
"#A good first week",
"Fill the schedule (or press Auto-fill), pick a message frame on the Message tab, commission a poll in an early state, and open a field office or two where the first contests are. Then end the week and read the news.",
"#The tutorial",
"Tutorial: Learn to Play on the main menu (or the Guided tutorial switch when you set up a campaign) gives you a tour of headquarters on your first turn and a tip the first time you reach each part of the game. In a campaign, Take the guided tour on this screen replays the tour.",
"#Staff",
"Any part of the campaign can be handed to your staff (Campaign tab): they will schedule, buy ads, run the field program, poll and pick the message for you. Use it to focus on what you enjoy.",
"#Keys",
"Space: end the week.  1-7: switch tabs.  Esc: deselect / cancel.  F1: this briefing.  Right-click a state: send the candidate there."],
["Each turn is one week. Your candidate has 21 slots - morning, afternoon and evening for seven days. Events in a state (rallies, town halls, retail stops, union halls, churches, campuses, community events, party dinners, fundraisers) happen where you put them; podcasts, TV interviews, call time and debate prep can be done from anywhere.", "Travel matters: a long same-day flight makes an event less effective and wears the candidate down; travel overnight instead (schedule the far state in the morning). Every event costs stamina - a tired candidate is more likely to make a gaffe. Rest restores stamina.", "Rallies build enthusiasm, recruit volunteers and grow your email list. Town halls persuade but risk unscripted moments. Retail politics is king in Iowa, New Hampshire and South Carolina. Podcasts and long-form interviews reach young men and low-information voters; crossover media (Fox for Democrats, CNN for Republicans) wins swing voters at a risk. Faith, union, campus and community events move specific groups.", "Podcasts are real shows. The biggest (Joe Rogan, Theo Von, Flagrant, Call Her Daddy and others) only book candidates voters have heard of: about 35% national name recognition for the top tier and 15% for mid-size shows; hosts far from your politics may not book you at all. Each appearance reports its views, reviews and the small donors it brings in. Rallies report their crowds - which grow with name recognition, enthusiasm and momentum - and the Campaign tab keeps the record.", "In the general election your surrogates and running mate campaign too: assign them states on the Schedule tab.", "#The final two weeks", "With fourteen days to go, each turn becomes a single day: what you do on Tuesday is resolved before you plan Wednesday. Pick a closing argument when the stretch begins; it builds every day you stick with it, and switching costs you most of what it has built.", "When the world intervenes - a mass shooting, a crisis in the Taiwan Strait, AI layoffs, a hurricane - you will be asked how to respond. Your answer moves your platform and specific voter groups."],
["Money comes from small-dollar donors (your email and text list - it grows with rallies, viral moments and digital ads), from big donors (fundraisers and bundler meetings, which tap them out over time), from self-funding, from allied groups and, after you win the nomination, from the party.", "TV is bought by media market in gross rating points (GRPs): 100 GRPs means the average viewer sees your ad once. Prices per point reflect each market's size and rise sharply toward November; candidates get the lowest unit rate in the final weeks. Ads can be positive, contrast or negative - negative is strongest but drives backlash if you are always attacking. Markets cross state lines: Philadelphia ads also reach New Jersey and Delaware.", "Digital ads are bought by state, then split across six platforms with a message for each (Money tab). Facebook skews older, Instagram and YouTube younger, TikTok creators reach Gen Z, streaming TV reaches cord-cutters over 30, and search ads build lists and remind people to vote. Messages: biography (name recognition), your issue focus, attack, get out the vote (late), or fundraising.", "Self-funding: set a weekly transfer from your own fortune and it arrives every week until you change it or the money runs out; you can also write a one-time check. Heavy personal spending costs you a little with progressive voters.", "A strong debate or a podcast that lands brings a burst of small-dollar donations.", "Headquarters can run lean, standard or as a juggernaut. Running out of cash forces debt and hurts morale.", "Allied super PACs are run by the computer: in the general election you can 'red-box' a state to signal where you want them to spend."],
["Field offices house paid organisers. Each organiser recruits and manages volunteers (roughly 45 active at a time); volunteers take shifts; shifts knock doors, make calls, send texts and reach friends and family. Contacts persuade a sliver of voters and - in the final six weeks - turn out your supporters.", "Volunteer activity ramps up as each state's vote approaches: the last weekend is the busiest of the campaign. A strong battleground program reaches hundreds of thousands of doors a week by October and a million in the final week; a national campaign knocks tens of millions of doors.", "Transfers to a state party fund its coordinated campaign: it hires organisers with a lag and also helps down-ballot candidates."],
["Every week choose a frame (your message), an attack line (or stay positive) and an issue focus: one main issue and up to two secondary ones. Credibility on an issue (0-100) builds every week you stay on it - fastest on the main issue - and drives how far voters trust you to handle it. Frames that fit the moment and your strengths build a narrative over weeks; switching frames resets it. Attack lines stick to opponents who fit them - flip-floppers, candidates over 70, the undisciplined, the extreme - and backfire if you go negative too often.", "Policy promises are permanent. Each moves your platform toward a position, wins over some voter groups and angers others, and may change how big donors feel about you. Promises far from your ideology cost you with activists (enthusiasm) and invite flip-flop attacks - but the general electorate may reward a move to the middle. Promises that contradict earlier ones are punished.", "Debates: in the primaries, candidates qualify by polling. Questions are drawn from the issues voters care about most. For each one you first choose an approach - policy depth, attack, pivot to message, personal story, a prepared zinger, or defend your record - then the actual line you deliver (attacks name a rival). When a rival comes after you, you get a rebuttal moment. Approaches beat each other like rock-paper-scissors; your ratings and debate prep decide how well you execute. In the general you negotiate how many debates, when, and on which networks."],
["Internal polls cost money; bigger samples and better methods (live phone plus text) are more accurate. Every internal poll includes crosstabs for up to thirty voter groups (too-small groups are not reported). Public polls appear on their own each week, mostly in competitive states; they have house effects - and this cycle, like every cycle, the polls may share a systematic error.", "#The map views", "Spending: your recent spending per state (deeper green = deeper investment).  Internal polls: your own polling - blue and red by who leads, faint when the poll is old or small, hatched where you have none.  Public polls: the press's averages.  Volunteers & doors: shifts this week (colour) and doors knocked to date (labels).  Primary calendar: results and upcoming dates.  Ballot access (independents): where you qualify.", "#Your pollster and the issues", "Set your pollster to light, standard or heavy (Polls tab) and polls arrive on their own. The Issues view shows the most important problem by state and group, whom voters trust to handle each issue, how many agree with your positions, and how those numbers have moved."],
["Democrats award delegates proportionally to candidates above 15% in each state (statewide and by district); this game models the statewide split. Their 2028 early window, adopted by the DNC in August 2026, runs South Carolina (Jan 22), Nevada, New Hampshire, New Mexico, Michigan and Virginia (Feb 29); you can change it before you start. Republicans begin in Iowa, New Hampshire, Nevada and South Carolina; after mid-March many Republican contests are winner-take-all or winner-take-most.", "Two years out, primary polls mostly measure name recognition; as voters tune in, skill, money and organisation take over. Winning - and beating expectations - creates momentum: money, press and voters follow. Candidates with no money and no path drop out: most of their voters move to the rival closest to them politically. If you're still in the race you can bid for the departing candidate's endorsement with policy promises, a cabinet post, the vice-presidential slot or a convention speech - and your rivals bid too. A majority of all delegates clinches the nomination; if no one has one by the convention, it goes to a second ballot.", "The sitting president is term-limited and is never a candidate, but his endorsement in the Republican primary is the most valuable prize in politics."],
["You can run as an independent with a candidate you create, in any scenario (it's easiest when a third force is already stirring). Start on Labor Day already on every ballot, or start the long campaign when the primaries begin and earn your ballot lines state by state.", "#Ballot access", "Each state sets its own signature requirement and filing deadline (2024 rules): from a few hundred signatures to well over a hundred thousand, due anywhere from spring to late summer. About three in four raw signatures survive challenges; the major parties sue to strike more. Paid circulators cost about $13 a signature, volunteers and organisers gather them for free. Miss a deadline and you can only be a write-in there.", "#Getting heard", "Independents start unknown and without a party's donors. Name recognition, viral moments and podcasts matter even more. Reach 15% in the national polls to make the fall debates.", "#Winning", "270 electoral votes wins outright. If no one reaches 270, the new House picks the president, one vote per state delegation - and the game estimates the House results to decide it."],
["Every state's electorate is modelled as 96 cells: 16 religious, racial and educational blocs (white evangelicals with and without degrees, white Catholics, other whites by education, Jewish, Latter-day Saint, Black, Mexican-American and other Hispanic, Cuban and Venezuelan, Puerto Rican and Dominican, Asian American, Native American, Arab and Muslim American, multiracial) times three age groups times two sexes. Overlays add rural/suburban/urban, union, veteran, gun-owning, LGBTQ, student and parent shares.", "Each cell's 2024 lean is calibrated so the model reproduces every state's 2024 result and the national exit-poll and validated-voter estimates for each group; 2020, 2022 and 2026 data shape trends and turnout. Composition is projected to 2028 (an older, more diverse, more college-educated electorate).", "Voters weigh 18 issues with group-specific views and salience: young voters care more about housing, student debt and Gaza; seniors about Social Security and Medicare; Arab and Muslim Americans about Israel above almost anything; evangelicals about abortion and gender; union households about trade and jobs. Candidates' ratings, records, platforms and group appeal, the national environment (approval, the economy) and every campaign's ads, visits and field work move each cell.", "Ratings are the game's estimates from public records - election results, fundraising, debate and interview reviews - not facts. Nothing in the game quotes a real person, and every event in a game is fiction."],
[
"Election results: county and state returns for 2016, 2020 and 2024 (tonmcg/US_County_Level_Election_Results; MIT Election Data and Science Lab). 2022 House popular vote by state (Cook Political Report).",

// ===================================================================================
//  Start-up: the window, the frame loop and input
// ===================================================================================
function $boot() {
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d', { alpha: false });
    $host.canvas = canvas;
    Elect.init();
    USMap.load();
    const p = new Battleground2028();
    APP = p;
    p.frame = {
        dispose() {
            $host.stopped = true;
            if (sfx !== null) sfx.stop();
            try { window.close(); } catch (e) { }
            document.body.innerHTML = '<div style="color:#93a4bf;font:16px sans-serif;display:flex;height:100vh;align-items:center;justify-content:center">Thanks for playing Battleground 2028. Reload the page to play again.</div>';
        }
    };
    sfx = new Sfx();
    sfx.start();
    document.getElementById('boot').remove();

    function resize() {
        const dpr = window.devicePixelRatio || 1;
        const w = window.innerWidth, h = window.innerHeight;
        if (w !== $host.cssW || h !== $host.cssH || dpr !== $host.dpr) {
            $host.cssW = w; $host.cssH = h; $host.dpr = dpr;
            canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
            canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
        }
    }
    function frame() {
        if ($host.stopped) return;
        resize();
        try {
            p.actionPerformed(null);
            const g = new Graphics2D(ctx, $host.dpr);
            p.paintComponent(g);
            g.dispose();
        } catch (e) { console.error(e); }
        requestAnimationFrame(frame);
    }

    // ---- input
    const unlock = () => $audio.unlock();
    let down = false;
    canvas.addEventListener('contextmenu', e => e.preventDefault());
    canvas.addEventListener('pointerdown', e => {
        unlock();
        down = true;
        try { canvas.setPointerCapture(e.pointerId); } catch (x) { }
        p.mousePressed(new MouseEventW(e, canvas));
        e.preventDefault();
    });
    canvas.addEventListener('pointerup', e => { down = false; p.mouseReleased(new MouseEventW(e, canvas)); });
    canvas.addEventListener('pointercancel', e => { down = false; p.mouseReleased(new MouseEventW(e, canvas)); });
    canvas.addEventListener('pointermove', e => {
        const w = new MouseEventW(e, canvas);
        if (down) p.mouseDragged(w); else p.mouseMoved(w);
    });
    canvas.addEventListener('pointerleave', e => { if (!down) p.mouseExited(new MouseEventW(e, canvas)); });
    canvas.addEventListener('wheel', e => {
        const k = e.deltaMode === 1 ? 1 / 3 : e.deltaMode === 2 ? 3 : 1 / 100;
        p.mouseWheelMoved(new MouseEventW(e, canvas, e.deltaY * k));
        e.preventDefault();
    }, { passive: false });
    const KEYS = { Enter: 10, Backspace: 8, Tab: 9, Escape: 27, ' ': 32, F1: 112, ArrowLeft: 37, ArrowUp: 38, ArrowRight: 39, ArrowDown: 40, Delete: 127 };
    window.addEventListener('keydown', e => {
        unlock();
        if (e.ctrlKey || e.metaKey || e.altKey) return;
        let code = KEYS[e.key];
        if (code === undefined && e.key.length === 1) {
            const c = e.key.toUpperCase().charCodeAt(0);
            code = (c >= 48 && c <= 57) || (c >= 65 && c <= 90) ? c : c;
        }
        if (code === undefined) return;
        p.keyPressed(new KeyEventW(code, 0));
        if (e.key.length === 1) p.keyTyped(new KeyEventW(code, e.key.charCodeAt(0)));
        if (e.key === ' ' || e.key === 'Tab' || e.key === 'F1' || e.key === 'Backspace' || e.key.startsWith('Arrow')) e.preventDefault();
    });
    window.addEventListener('keyup', e => { if (code0(e) !== undefined) p.keyReleased(new KeyEventW(code0(e), 0)); });
    function code0(e) { return KEYS[e.key] !== undefined ? KEYS[e.key] : (e.key.length === 1 ? e.key.toUpperCase().charCodeAt(0) : undefined); }
    window.__bg = { get app() { return APP; }, Tutorial, Screens, Hq, Night, Results, Week, Setup, Settings, candById, DebateView, Debates, Tabs, Creator, FieldScreen, Deals, Polls, Loading, SaveGame, Primary, Endorse };
    canvas.focus();
    resize();
    requestAnimationFrame(frame);
}
if (typeof document !== 'undefined') {
    window.addEventListener('load', () => setTimeout(() => {
        try { $boot(); } catch (e) {
            console.error(e);
            const b = document.getElementById('boot');
            if (b) b.textContent = 'Could not start the game: ' + e;
        }
    }, 20));
}

})();
